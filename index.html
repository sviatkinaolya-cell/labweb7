<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Випадковий жарт</title>
</head>
<body>

<h2>Випадковий жарт</h2>

<button onclick="loadJoke()">Показати жарт</button>
<p id="joke"></p>

<script>
function loadJoke() {
    let xhr = new XMLHttpRequest();
    xhr.open("GET", "jokes.txt", true);

    xhr.onload = function () {
        if (xhr.status === 200) {
            let jokes = xhr.responseText.split("\n");
            let randomJoke = jokes[Math.floor(Math.random() * jokes.length)];
            document.getElementById("joke").innerText = randomJoke;
        }
    };

    xhr.send();
}
</script>

</body>
</html>
